<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Locking user data with Tide</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 16px; }
      h1 { font-size: 20px; margin: 0; }
      #status, dt { color: GrayText; }
      #status { margin: 4px 0 24px; }
      form { display: flex; gap: 8px; }
      input { flex: 1; }
      input, button { font: inherit; padding: 4px 12px; }
      dt { font-size: 13px; margin-top: 16px; }
      dd { margin: 0; overflow-wrap: anywhere; }
      [role=alert] { --tone: orange; margin: 24px 0 0; padding: 12px 16px; border: 1px solid var(--tone); border-left-width: 6px; border-radius: 6px; background: color-mix(in srgb, var(--tone) 15%, transparent); overflow-wrap: anywhere; }
      [role=alert].error { --tone: crimson; }
      [role=alert] strong { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
