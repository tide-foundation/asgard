<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DPoP Test SPA</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; padding: 2rem; background: #f5f5f5; }
      h1 { margin-bottom: 1rem; }
      #status { padding: 1rem; background: #fff; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #ddd; }
      button { padding: 0.5rem 1rem; margin-right: 0.5rem; margin-bottom: 0.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-danger { background: #dc2626; color: #fff; }
      .btn-success { background: #16a34a; color: #fff; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #result { margin-top: 1rem; padding: 1rem; background: #1e1e1e; color: #0f0; border-radius: 8px; font-family: monospace; white-space: pre-wrap; min-height: 80px; display: none; }
      .label { font-weight: 600; color: #555; font-size: 0.9rem; }
      .value { color: #111; }
      .info-row { margin: 0.25rem 0; }
    </style>
  </head>
  <body>
    <h1>DPoP Test SPA</h1>

    <div id="status">
      <p class="label">Status: <span id="auth-status" class="value">Initializing...</span></p>
    </div>

    <div id="user-info" style="display:none">
      <div id="status">
        <div class="info-row"><span class="label">User: </span><span id="user-name" class="value"></span></div>
        <div class="info-row"><span class="label">Email: </span><span id="user-email" class="value"></span></div>
        <div class="info-row"><span class="label">Token Type: </span><span id="token-type" class="value"></span></div>
      </div>
    </div>

    <div style="margin-top: 1rem;">
      <button id="btn-login" class="btn-primary" style="display:none">Login</button>
      <button id="btn-logout" class="btn-danger" style="display:none">Logout</button>
      <button id="btn-call-api" class="btn-success" style="display:none">Call /Hello (DPoP)</button>
      <button id="btn-setup-policy" class="btn-primary" style="display:none">Setup Policy</button>

    </div>

    <div id="result"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
